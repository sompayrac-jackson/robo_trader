<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robo Trader — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 2.5rem 2rem; width: 100%; max-width: 360px; }
    h1 { font-size: 1.25rem; color: #1a1a2e; margin-bottom: .25rem; }
    p { font-size: .85rem; color: #888; margin-bottom: 1.75rem; }
    label { display: block; font-size: .75rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .5px; margin-bottom: .4rem; }
    input[type=password] { width: 100%; padding: .65rem .85rem; border: 1px solid #ddd; border-radius: 6px; font-size: .95rem; outline: none; margin-bottom: 1rem; }
    input[type=password]:focus { border-color: #4f8ef7; box-shadow: 0 0 0 3px rgba(79,142,247,.15); }
    button { width: 100%; padding: .7rem; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; font-size: .95rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #2d2d4e; }
    .error { background: #fde8e8; color: #a02020; padding: .6rem .85rem; border-radius: 6px; font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Robo Trader</h1>
    <p>Enter your dashboard password to continue.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
